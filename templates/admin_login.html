<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sri Shakthi - Admin Login</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/ram-logo.png') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
  </head>
  <body>
    <main class="login-page">
      <div class="login-card">
        <div class="mark"><img src="{{ url_for('static', filename='images/ram-logo.png') }}" alt="Sri Shakthi" /></div>
        <h1>Admin sign in</h1>
        <p class="sub">Manage enquiries, photos and room prices.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
          <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
          {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form id="loginForm" method="post" onsubmit="showLoading(event)">
          <label>Username
            <input class="input" type="text" name="username" autocomplete="username" required />
          </label>
          <label>Password
            <input class="input" type="password" name="password" autocomplete="current-password" required />
          </label>
          <button class="btn btn--cobalt" type="submit">Sign in</button>
        </form>
      </div>
    </main>

    <div class="overlay" id="overlay" role="status" aria-live="polite">
      <div class="message"><span class="spinner"></span>Authenticating...</div>
    </div>

    <script>
      function showLoading(event) {
        event.preventDefault();
        document.getElementById("overlay").style.display = "flex";

        setTimeout(function () {
          document.getElementById("overlay").style.display = "none";
          document.getElementById("loginForm").submit();
        }, 1500);
      }
    </script>
  </body>
</html>
